# Round robin over the two instances (compose.scale.yml). Nothing is sticky:
# any instance can serve any request, live replies included.
upstream claudia {
  server app1:8080;
  server app2:8080;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  client_max_body_size 30m;

  location / {
    proxy_pass http://claudia;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket (/api/ws)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Live replies are server-sent events: no buffering, long reads
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
