name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (type-check, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  web:
    name: Web (shared deps, type-check, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claudia
          POSTGRES_PASSWORD: claudia
          POSTGRES_DB: claudia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claudia -d claudia_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: web
    env:
      # Migration tests run on real PostgreSQL as well as PGlite
      TEST_DATABASE_URL: postgres://claudia:claudia@localhost:5432/claudia_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # web/ installs only its own dependencies: the root node_modules never exist here
      - name: Install dependencies
        run: npm ci

      - name: Shared code dependencies
        run: npm run check:shared-deps

      - name: Type-check
        run: npm run type-check

      - name: Test (PGlite and PostgreSQL)
        run: npm test

      - name: Build
        run: npm run build

      - name: One copy of React and Redux in the bundle
        run: npm run check:bundle

  web-docker:
    name: Web (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f web/docker/Dockerfile -t claudia-web:ci .

      - name: Start and check readiness (embedded database)
        run: |
          docker run -d --name claudia -p 8080:8080 claudia-web:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/readyz; then echo; exit 0; fi
            sleep 1
          done
          docker logs claudia
          exit 1
