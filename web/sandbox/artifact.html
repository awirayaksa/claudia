<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Claudia artifact</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; }
      iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
      #error { display: none; margin: 12px; padding: 10px 12px; border-radius: 6px; font: 13px/1.5 system-ui, sans-serif; color: #9b1c1c; background: #fdecec; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      Renders an artifact (HTML, SVG or a React component) that the app sends
      with {type: 'claudia-artifact-render', kind, code}. The content runs in
      a nested srcdoc frame with sandbox="allow-scripts" only (an opaque
      origin: no storage, no cookies, no access to this page or the app) and
      a CSP that allows no network requests.
    -->
    <div id="error" role="alert"></div>
    <iframe id="frame" sandbox="allow-scripts" title="Artifact"></iframe>
    <script src="/artifact.js"></script>
  </body>
</html>
