# Two Claudia Web instances behind a load balancer, sharing PostgreSQL,
# Redis and S3 storage: the multi-instance setup (and its CI test).
#
#   cd web/docker
#   export CLAUDIA_SECRET_KEY=$(openssl rand -base64 48)
#   docker compose -f compose.scale.yml up -d --build --wait
#
# http://localhost:8080 is the load balancer (round robin, no sticky
# sessions needed); :8081 and :8082 reach one instance each.
#
# Storage here is S3Mock, an S3 test server that keeps files in its
# container: for real use point S3_* at AWS S3 or your own S3-compatible
# service (MinIO, Ceph, Garage, SeaweedFS…) and drop the `s3` service.
# The built-in file tools keep per-user workspaces in DATA_DIR, so the
# instances share the `claudia-data` volume (on several hosts: a shared
# filesystem such as NFS).

name: claudia-scale

x-app: &app
  build:
    context: ../..
    dockerfile: web/docker/Dockerfile
  image: claudia-web:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://claudia:${POSTGRES_PASSWORD:-claudia}@db:5432/claudia
    REDIS_URL: redis://redis:6379
    S3_BUCKET: ${S3_BUCKET:-claudia}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9090}
    S3_FORCE_PATH_STYLE: "true"
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-claudia}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-claudia-s3-secret}
    CLAUDIA_SECRET_KEY: ${CLAUDIA_SECRET_KEY:?Set CLAUDIA_SECRET_KEY (at least 32 characters), e.g. openssl rand -base64 48}
    CLAUDIA_PUBLIC_URL: ${CLAUDIA_PUBLIC_URL:-}
    CLAUDIA_SANDBOX_ORIGIN: ${CLAUDIA_SANDBOX_ORIGIN:-}
    CLAUDIA_ADMIN_EMAIL: ${CLAUDIA_ADMIN_EMAIL:-}
    CLAUDIA_ADMIN_PASSWORD: ${CLAUDIA_ADMIN_PASSWORD:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  volumes:
    - claudia-data:/data
  # The CI test runs its mock model server on the host
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3:
      condition: service_healthy

services:
  app1:
    <<: *app
    ports:
      - "${CLAUDIA_PORT_1:-8081}:8080"
  app2:
    <<: *app
    ports:
      - "${CLAUDIA_PORT_2:-8082}:8080"

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${CLAUDIA_PORT:-8080}:8080"
    volumes:
      - ./nginx.scale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: claudia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claudia}
      POSTGRES_DB: claudia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudia -d claudia"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-claudia}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  claudia-data:
  pgdata:
